<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>AI Hub</title><link rel="stylesheet" href="popup.css"></head><body>
<h1>Chrome 自动连接</h1><p>打开桌面端，在日常 Chrome 登录 ChatGPT、Gemini 或 Grok，已打开的标签页会自动接入 AI Hub。</p>
<p id="status" role="status">正在检查连接…</p><button id="toggle" class="secondary">暂停自动连接</button>
<small>无需连接码。每个站点保持一个对话标签页连接；登录态留在 Chrome。进入认证页面会释放控制，登录后自动恢复。Chrome 的调试提示来自页面连接权限，点击取消会暂停自动连接。</small>
<script type="module" src="popup.js"></script></body></html>
