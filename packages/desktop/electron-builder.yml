appId: com.agentroam.desktop
productName: AgentRoam
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/prebuilds/**/*"
directories:
  output: release
files:
  - dist/main/**/*
  - renderer-dist/**/*
  - package.json
  - node_modules/**/*
  # @agent/* 是软链到 workspace 的包，打包时只带构建产物，不带 sourcemap
  - "!node_modules/@agent/core/dist/**/*.d.ts.map"
  - "!node_modules/@agent/core/dist/**/*.js.map"
  - "!node_modules/@agent/native-runtime/dist/**/*.d.ts.map"
  - "!node_modules/@agent/native-runtime/dist/**/*.js.map"
extraResources:
  - from: chrome-extension
    to: chrome-extension
  - from: assets
    to: assets
    filter:
      - app-icon.png
      - webrtc-live.html
  - from: assets/bin
    to: bin
mac:
  icon: assets/app-icon.icns
  target:
    - target: dmg
      arch: arm64
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: AgentRoam-${version}-arm64.dmg
win:
  icon: assets/app-icon.ico
  target:
    - target: nsis
      arch: x64
  verifyUpdateCodeSignature: false
  artifactName: AgentRoam-Setup-${version}-x64.exe
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
