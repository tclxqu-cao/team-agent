appId: com.agentroam.desktop.lite
productName: AgentRoam Lite
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/prebuilds/**/*"
directories:
  output: release
npmRebuild: false
extraMetadata:
  name: agentroam-lite
  main: ./dist/main/lite-index.js
files:
  - dist/main/lite-index.js
  - dist/main/lite-preload.cjs
  - dist/main/lite-pairing.js
  - dist/main/codex-sharing-setup.js
  - dist/main/shared-service.js
  - dist/main/mobile-pairing.js
  - dist/main/runtime-bootstrap.js
  - dist/main/desktop-live-cli-proxy.js
  - renderer-lite-dist/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/@agent/*/dist/**/*.map"
extraResources:
  - from: assets/runtime
    to: runtime
  - from: assets/bootstrap
    to: bootstrap
mac:
  icon: assets/app-icon.icns
  target:
    - target: dmg
      arch: arm64
  sign: scripts/sign-macos.cjs
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: AgentRoam-Lite-${version}-arm64.dmg
win:
  icon: assets/app-icon.ico
  target:
    - target: nsis
      arch: x64
  verifyUpdateCodeSignature: false
  artifactName: AgentRoam-Lite-Setup-${version}-x64.exe
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
