name: agent-runtime-soak

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  group: agent-runtime-upgrade
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      active: ${{ steps.state.outputs.active }}
      issue: ${{ steps.state.outputs.issue }}
      agent: ${{ steps.state.outputs.agent }}
      runtime_version: ${{ steps.state.outputs.runtime_version }}
      version: ${{ steps.state.outputs.version }}
      base_sha: ${{ steps.state.outputs.base_sha }}
      merge_sha: ${{ steps.state.outputs.merge_sha }}
      preview_started_at: ${{ steps.state.outputs.preview_started_at }}
      previous_preview: ${{ steps.state.outputs.previous_preview }}
      hold: ${{ steps.state.outputs.hold }}
    steps:
      - name: Locate the only active soak candidate
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput("active", "false");
            const issues = (await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "agent-runtime-upgrade,agent-runtime-active",
              per_page: 100,
            })).filter((item) => !item.pull_request);
            if (issues.length === 0) return core.notice("No active Agent runtime soak candidate");
            if (issues.length !== 1) throw new Error(`Expected one active Agent runtime candidate, found ${issues.length}`);
            const issue = issues[0];
            const labels = issue.labels.map((label) => typeof label === "string" ? label : label.name);
            if (!labels.includes("agent-runtime-soak")) return core.notice("The active candidate has not entered soak");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const states = comments.flatMap((comment) => {
              const match = comment.body?.match(/<!-- agent-runtime-state (\{.*\}) -->/);
              if (!match) return [];
              try { return [JSON.parse(match[1])]; } catch { return []; }
            });
            const state = states.at(-1);
            if (!state || state.state !== "soaking" || state.schemaVersion !== 1) throw new Error("Active issue has no valid soaking state");
            if (!["codex", "claude", "opencode"].includes(state.agent)) throw new Error("Soak state has an invalid Agent");
            if (!/^\d+\.\d+\.\d+$/.test(state.runtimeVersion)) throw new Error("Soak state has an invalid runtime version");
            if (!/^\d+\.\d+\.\d+-preview\.\d+$/.test(state.version)) throw new Error("Soak state has an invalid AgentRoam version");
            if (!/^[0-9a-f]{40}$/i.test(state.baseSha) || !/^[0-9a-f]{40}$/i.test(state.mergeSha)) throw new Error("Soak state has an invalid source SHA");
            core.setOutput("active", "true");
            core.setOutput("issue", String(issue.number));
            core.setOutput("agent", state.agent);
            core.setOutput("runtime_version", state.runtimeVersion);
            core.setOutput("version", state.version);
            core.setOutput("base_sha", state.baseSha);
            core.setOutput("merge_sha", state.mergeSha);
            core.setOutput("preview_started_at", state.previewStartedAt);
            core.setOutput("previous_preview", state.previousPreview ?? "");
            core.setOutput("hold", labels.includes("promotion-hold") ? "true" : "false");

  toolkit:
    needs: metadata
    if: needs.metadata.outputs.active == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.base_sha }}
          persist-credentials: false
      - name: Stage trusted dist-tag toolkit
        run: |
          mkdir -p "$RUNNER_TEMP/toolkit/scripts"
          cp scripts/agentroam-release-lib.mjs "$RUNNER_TEMP/toolkit/scripts/"
          cp scripts/publish-agentroam-release.mjs "$RUNNER_TEMP/toolkit/scripts/"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-soak-toolkit-${{ github.run_id }}
          path: ${{ runner.temp }}/toolkit/
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: metadata
    if: needs.metadata.outputs.active == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    environment: agent-runtime-smoke-${{ needs.metadata.outputs.agent }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.merge_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Install and verify the exact published preview
        shell: bash
        env:
          AGENTROAM_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/preview-data"
          npm install \
            --prefix "$RUNNER_TEMP/preview-install" \
            --cache "$RUNNER_TEMP/npm-cache" \
            --registry https://registry.npmjs.org \
            --ignore-scripts --no-audit --no-fund \
            "agentroam@$AGENTROAM_VERSION"
          AGENTROAM_DATA_DIR="$RUNNER_TEMP/preview-data" \
            node "$RUNNER_TEMP/preview-install/node_modules/agentroam/bin/agentroam.mjs" doctor
      - name: Resolve exact native runtime
        shell: bash
        env:
          AGENT: ${{ needs.metadata.outputs.agent }}
          VERSION: ${{ needs.metadata.outputs.runtime_version }}
        run: |
          TARGET=darwin-arm64
          if [ "$RUNNER_OS" = "Windows" ]; then TARGET=windows-amd64; fi
          case "$AGENT" in
            codex)
              TARGET="$TARGET" DATA_DIR="$RUNNER_TEMP/managed" bun --eval 'import { resolveCodexRuntime } from "./packages/cli/src/codex-runtime-manager.ts"; const r = await resolveCodexRuntime({ dataDir: process.env.DATA_DIR, target: process.env.TARGET }); console.log(r.executable)' > "$RUNNER_TEMP/executable.txt"
              ;;
            opencode)
              TARGET="$TARGET" DATA_DIR="$RUNNER_TEMP/managed" bun --eval 'import { resolveOpenCodeRuntime } from "./packages/cli/src/opencode-runtime-manager.ts"; const r = await resolveOpenCodeRuntime({ dataDir: process.env.DATA_DIR, target: process.env.TARGET }); console.log(r.executable)' > "$RUNNER_TEMP/executable.txt"
              ;;
            claude)
              PLATFORM=darwin-arm64
              FILE=claude
              if [ "$RUNNER_OS" = "Windows" ]; then PLATFORM=win32-x64; FILE=claude.exe; fi
              CLAUDE_BIN=$(find node_modules/.bun -path "*claude-agent-sdk-$PLATFORM@$VERSION*/node_modules/@anthropic-ai/claude-agent-sdk-$PLATFORM/$FILE" -type f -print -quit)
              test -n "$CLAUDE_BIN"
              chmod +x "$CLAUDE_BIN" || true
              echo "$(dirname "$CLAUDE_BIN")" >> "$GITHUB_PATH"
              ;;
          esac
      - name: Run authenticated exact-version smoke
        shell: bash
        env:
          AGENT: ${{ needs.metadata.outputs.agent }}
          VERSION: ${{ needs.metadata.outputs.runtime_version }}
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
          AGENTROAM_OPENCODE_CONFIG_JSON: ${{ secrets.OPENCODE_CONFIG_JSON }}
        run: |
          test -n "$PROVIDER_API_KEY"
          EXTRA_ARGS=()
          case "$AGENT" in
            codex)
              export OPENAI_API_KEY="$PROVIDER_API_KEY"
              EXTRA_ARGS=(--expected-version "$VERSION" --executable "$(cat "$RUNNER_TEMP/executable.txt")")
              ;;
            claude)
              export ANTHROPIC_API_KEY="$PROVIDER_API_KEY"
              ;;
            opencode)
              export OPENCODE_API_KEY="$PROVIDER_API_KEY"
              test -n "$AGENTROAM_OPENCODE_CONFIG_JSON"
              EXTRA_ARGS=(--expected-version "$VERSION" --executable "$(cat "$RUNNER_TEMP/executable.txt")")
              ;;
          esac
          bun scripts/agent-runtime-live-smoke.ts --agent "$AGENT" --workspace "$RUNNER_TEMP/workspace" --runtime-home "$RUNNER_TEMP/runtime-home" "${EXTRA_ARGS[@]}" > "$RUNNER_TEMP/smoke-$RUNNER_OS.json" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-runtime-soak-${{ runner.os }}-${{ needs.metadata.outputs.version }}
          path: ${{ runner.temp }}/smoke-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

  record:
    needs: [metadata, smoke]
    if: always() && needs.metadata.outputs.active == 'true'
    runs-on: ubuntu-24.04
    outputs:
      success: ${{ steps.ledger.outputs.success }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: agent-runtime-soak-*-${{ needs.metadata.outputs.version }}
          path: summaries
          merge-multiple: true
      - name: Normalize both platform results
        id: ledger
        env:
          MATRIX_RESULT: ${{ needs.smoke.result }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readdirSync, readFileSync, writeFileSync } from "node:fs";
          const files = existsSync("summaries") ? readdirSync("summaries").filter((name) => name.endsWith(".json")) : [];
          const summaries = files.flatMap((name) => {
            try { return [{ fileName: name, value: JSON.parse(readFileSync(`summaries/${name}`, "utf8")) }]; } catch { return []; }
          });
          const expectedFiles = new Set(["smoke-macOS.json", "smoke-Windows.json"]);
          const success = process.env.MATRIX_RESULT === "success"
            && summaries.length === 2
            && summaries.every(({ fileName, value }) => expectedFiles.delete(fileName) && value.success === true)
            && expectedFiles.size === 0;
          const ledger = {
            schemaVersion: 1,
            checkedAt: new Date().toISOString(),
            version: process.env.VERSION,
            success,
            platforms: summaries.map(({ fileName, value }) => ({ platform: fileName.slice(6, -5), agent: value.agent, runtimeVersion: value.runtimeVersion, success: value.success, failureCategory: value.failureCategory })),
          };
          writeFileSync("ledger.json", JSON.stringify(ledger, null, 2) + "\n");
          appendFileSync(process.env.GITHUB_OUTPUT, `success=${success ? "true" : "false"}\n`);
          NODE
      - name: Append soak ledger
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.metadata.outputs.issue }}
        with:
          script: |
            const fs = require("fs");
            const ledger = JSON.parse(fs.readFileSync("ledger.json", "utf8"));
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.ISSUE_NUMBER), body: `<!-- agent-runtime-soak-result ${JSON.stringify(ledger)} -->\n${ledger.success ? "macOS and Windows smoke passed." : "Soak smoke failed; preview rollback required."}` });

  rollback-preview:
    needs: [metadata, toolkit, record]
    if: always() && needs.metadata.outputs.active == 'true' && needs.record.outputs.success != 'true'
    runs-on: ubuntu-24.04
    environment: agent-runtime-publish-npm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: agent-runtime-soak-toolkit-${{ github.run_id }}
          path: toolkit
      - name: Restore prior preview dist-tags
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARGET: ${{ needs.metadata.outputs.previous_preview }}
        run: |
          test -n "$NPM_TOKEN"
          test -n "$TARGET"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          node toolkit/scripts/publish-agentroam-release.mjs rollback-preview --to "$TARGET"
      - uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.metadata.outputs.issue }}
        with:
          script: |
            const issue = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue, labels: ["needs-human"] });
            for (const name of ["agent-runtime-active", "agent-runtime-soak"]) await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue, name }).catch(() => undefined);
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue, body: "Preview dist-tags restored after a failed macOS/Windows soak check. Candidate retained for audit." });

  promotion-eligibility:
    needs: [metadata, record]
    if: needs.metadata.outputs.active == 'true' && needs.record.outputs.success == 'true'
    runs-on: ubuntu-24.04
    outputs:
      promote: ${{ steps.check.outputs.promote }}
    steps:
      - name: Require 24 hours and four qualifying windows
        id: check
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.metadata.outputs.issue }}
          STARTED_AT: ${{ needs.metadata.outputs.preview_started_at }}
          HOLD: ${{ needs.metadata.outputs.hold }}
          VERSION: ${{ needs.metadata.outputs.version }}
        with:
          script: |
            core.setOutput("promote", "false");
            if (process.env.HOLD === "true") return core.notice("Promotion is held");
            const start = Date.parse(process.env.STARTED_AT);
            const now = Date.now();
            if (!Number.isFinite(start) || now - start < 24 * 60 * 60 * 1000) return core.notice("24-hour soak is not complete");
            const active = (await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "agent-runtime-upgrade,agent-runtime-active",
              per_page: 100,
            })).filter((item) => !item.pull_request);
            if (active.length !== 1 || active[0].number !== Number(process.env.ISSUE_NUMBER)) return core.notice("Active candidate changed during soak");
            const currentPreview = BigInt(process.env.VERSION.match(/-preview\.(\d+)$/)?.[1] ?? -1);
            const openCandidates = await github.paginate(github.rest.pulls.list, { owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100 });
            const hasNewerCandidate = openCandidates.some((pull) => {
              const match = pull.body?.match(/AgentRoam candidate:\s*\d+\.\d+\.\d+-preview\.(\d+)/);
              return match && BigInt(match[1]) > currentPreview;
            });
            if (hasNewerCandidate) return core.notice("A newer Agent runtime candidate exists");
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.ISSUE_NUMBER), per_page: 100 });
            const results = comments.flatMap((comment) => {
              const match = comment.body?.match(/<!-- agent-runtime-soak-result (\{.*\}) -->/);
              if (!match) return [];
              try { return [JSON.parse(match[1])]; } catch { return []; }
            }).filter((value) => value.version === process.env.VERSION && value.success === true).map((value) => Date.parse(value.checkedAt)).filter(Number.isFinite);
            const windowMs = 6 * 60 * 60 * 1000;
            const windowsPass = [0, 1, 2, 3].every((index) => results.some((stamp) => stamp >= start + index * windowMs && stamp < start + (index + 1) * windowMs));
            const finalFresh = results.some((stamp) => now - stamp <= 2 * 60 * 60 * 1000);
            if (windowsPass && finalFresh) core.setOutput("promote", "true");
            else core.notice(`Promotion gates incomplete: windows=${windowsPass}, finalFresh=${finalFresh}`);

  promote:
    needs: [metadata, toolkit, record, promotion-eligibility]
    if: needs.promotion-eligibility.outputs.promote == 'true'
    runs-on: ubuntu-24.04
    environment: agent-runtime-publish-npm
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: agent-runtime-soak-toolkit-${{ github.run_id }}
          path: toolkit
      - name: Revalidate preview and promote immutable artifacts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          test -n "$NPM_TOKEN"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          TOOLKIT="$GITHUB_WORKSPACE/toolkit/scripts/agentroam-release-lib.mjs" VERSION="$VERSION" node --input-type=module <<'NODE'
          import { pathToFileURL } from "node:url";
          const lib = await import(pathToFileURL(process.env.TOOLKIT));
          const release = lib.releaseSetForVersion(process.env.VERSION);
          const client = lib.createNpmClient();
          await lib.verifyReleaseTag(release, client, "preview", process.env.VERSION);
          const latest = await Promise.all(release.packages.map((item) => client.getTag(item.name, "latest")));
          if (new Set(latest).size !== 1) throw new Error("latest tags are not aligned before promotion");
          const prior = latest[0];
          if (prior && lib.compareAgentRoamVersions(process.env.VERSION, prior) <= 0) throw new Error(`refusing non-monotonic promotion over ${prior}`);
          NODE
          node toolkit/scripts/publish-agentroam-release.mjs promote-latest --version "$VERSION"
      - name: Complete tracking issue
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.metadata.outputs.issue }}
          VERSION: ${{ needs.metadata.outputs.version }}
        with:
          script: |
            const issue = Number(process.env.ISSUE_NUMBER);
            for (const name of ["agent-runtime-active", "agent-runtime-soak"]) await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue, name }).catch(() => undefined);
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue, body: `AgentRoam ${process.env.VERSION} passed the 24-hour soak and all seven npm latest tags were promoted.` });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue, state: "closed" });
