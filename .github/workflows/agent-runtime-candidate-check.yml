name: agent-runtime-candidate-check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: agent-runtime-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'agent-runtime-candidate')
    runs-on: ubuntu-24.04
    outputs:
      agent: ${{ steps.meta.outputs.agent }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve immutable candidate metadata
        id: meta
        shell: bash
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          case ",$LABELS," in
            *,agent-runtime-codex,*) AGENT=codex ;;
            *,agent-runtime-claude,*) AGENT=claude ;;
            *,agent-runtime-opencode,*) AGENT=opencode ;;
            *) echo "Missing Agent label" >&2; exit 1 ;;
          esac
          VERSION=${BRANCH#chore/upgrade-$AGENT-}
          if [[ "$VERSION" == "$BRANCH" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid candidate branch: $BRANCH" >&2
            exit 1
          fi
          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  static-checks:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Deterministic gates
        id: deterministic
        continue-on-error: true
        env:
          AGENT: ${{ needs.metadata.outputs.agent }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/agent-runtime-upgrade.mjs check
          node scripts/check-agent-runtime-diff.mjs --agent "$AGENT" --base "$BASE_SHA" --head "$HEAD_SHA"
          node --test scripts/agent-runtime-upgrade.test.mjs scripts/check-agent-runtime-diff.test.mjs scripts/publish-agentroam-release.test.mjs scripts/agent-runtime-workflow-contract.test.mjs
          bunx vitest run scripts/agent-runtime-live-smoke.test.ts
          bunx tsc -p scripts/tsconfig.agent-runtime.json
      - name: Focused runtime contracts
        id: focused
        continue-on-error: true
        shell: bash
        env:
          AGENT: ${{ needs.metadata.outputs.agent }}
        run: |
          case "$AGENT" in
            codex) bunx vitest run packages/cli/src/codex-runtime-manager.test.ts packages/desktop/main/agent-runtime/codex-runtime-adapter.test.ts ;;
            claude) bunx vitest run packages/desktop/main/agent-runtime/claude-runtime-adapter.test.ts ;;
            opencode) bunx vitest run packages/cli/src/opencode-runtime-manager.test.ts packages/desktop/main/agent-runtime/opencode-runtime-adapter.test.ts packages/desktop/main/agent-runtime/opencode-server-client.test.ts ;;
          esac
      - name: Type checks and production builds
        id: build
        continue-on-error: true
        run: |
          bunx tsc --noEmit -p packages/desktop/tsconfig.json
          bunx tsc --noEmit -p packages/server/tsconfig.json
          bunx tsc --noEmit -p packages/cli/tsconfig.json
          bun run --cwd packages/webapp build
          NEXT_STANDALONE=1 bun run --cwd packages/server build
      - name: Write normalized validation summary
        if: always()
        env:
          DETERMINISTIC: ${{ steps.deterministic.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const checks = {
            deterministic: process.env.DETERMINISTIC,
            focused: process.env.FOCUSED,
            build: process.env.BUILD,
          };
          const success = Object.values(checks).every((value) => value === "success");
          writeFileSync(process.env.RUNNER_TEMP + "/candidate-failure.json", JSON.stringify({
            schemaVersion: 1,
            success,
            category: success ? null : "compatibility",
            checks,
          }, null, 2) + "\n");
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-failure-summary-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/candidate-failure.json
          if-no-files-found: error
          retention-days: 7
      - name: Fail unsuccessful validation
        if: steps.deterministic.outcome != 'success' || steps.focused.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1

  macos-package:
    needs: [metadata, static-checks]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
      - run: bun install --frozen-lockfile
      - run: npm run pack:cli:all
      - run: node scripts/publish-agentroam-release.mjs preflight
      - run: node scripts/verify-cli-install.mjs --artifacts dist/cli-release --bootstrap-script
      - uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-candidate-${{ github.event.pull_request.head.sha }}
          path: dist/cli-release/
          if-no-files-found: error
          retention-days: 7

  windows-install:
    needs: [metadata, macos-package]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: agent-runtime-candidate-${{ github.event.pull_request.head.sha }}
          path: dist/cli-release
      - run: node scripts/publish-agentroam-release.mjs preflight
      - run: node scripts/verify-cli-install.mjs --artifacts dist/cli-release --bootstrap-script

  authenticated-smoke:
    needs: [metadata, static-checks]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    environment: agent-runtime-smoke-${{ needs.metadata.outputs.agent }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Resolve exact native runtime
        shell: bash
        env:
          AGENT: ${{ needs.metadata.outputs.agent }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          TARGET=darwin-arm64
          if [ "$RUNNER_OS" = "Windows" ]; then TARGET=windows-amd64; fi
          case "$AGENT" in
            codex)
              TARGET="$TARGET" DATA_DIR="$RUNNER_TEMP/managed" bun --eval 'import { resolveCodexRuntime } from "./packages/cli/src/codex-runtime-manager.ts"; const r = await resolveCodexRuntime({ dataDir: process.env.DATA_DIR, target: process.env.TARGET }); console.log(r.executable)' > "$RUNNER_TEMP/executable.txt"
              ;;
            opencode)
              TARGET="$TARGET" DATA_DIR="$RUNNER_TEMP/managed" bun --eval 'import { resolveOpenCodeRuntime } from "./packages/cli/src/opencode-runtime-manager.ts"; const r = await resolveOpenCodeRuntime({ dataDir: process.env.DATA_DIR, target: process.env.TARGET }); console.log(r.executable)' > "$RUNNER_TEMP/executable.txt"
              ;;
            claude)
              PLATFORM=darwin-arm64
              FILE=claude
              if [ "$RUNNER_OS" = "Windows" ]; then PLATFORM=win32-x64; FILE=claude.exe; fi
              CLAUDE_BIN=$(find node_modules/.bun -path "*claude-agent-sdk-$PLATFORM@$VERSION*/node_modules/@anthropic-ai/claude-agent-sdk-$PLATFORM/$FILE" -type f -print -quit)
              test -n "$CLAUDE_BIN"
              chmod +x "$CLAUDE_BIN" || true
              echo "$(dirname "$CLAUDE_BIN")" >> "$GITHUB_PATH"
              ;;
          esac
      - name: Run authenticated exact-version smoke
        shell: bash
        env:
          AGENT: ${{ needs.metadata.outputs.agent }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PROVIDER_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
          AGENTROAM_OPENCODE_CONFIG_JSON: ${{ secrets.OPENCODE_CONFIG_JSON }}
        run: |
          test -n "$PROVIDER_API_KEY"
          EXTRA_ARGS=()
          case "$AGENT" in
            codex)
              export OPENAI_API_KEY="$PROVIDER_API_KEY"
              EXTRA_ARGS=(--expected-version "$VERSION" --executable "$(cat "$RUNNER_TEMP/executable.txt")")
              ;;
            claude)
              export ANTHROPIC_API_KEY="$PROVIDER_API_KEY"
              ;;
            opencode)
              export OPENCODE_API_KEY="$PROVIDER_API_KEY"
              test -n "$AGENTROAM_OPENCODE_CONFIG_JSON"
              EXTRA_ARGS=(--expected-version "$VERSION" --executable "$(cat "$RUNNER_TEMP/executable.txt")")
              ;;
          esac
          bun scripts/agent-runtime-live-smoke.ts --agent "$AGENT" --workspace "$RUNNER_TEMP/workspace" --runtime-home "$RUNNER_TEMP/runtime-home" "${EXTRA_ARGS[@]}" > "$RUNNER_TEMP/smoke-$RUNNER_OS.json" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-runtime-candidate-smoke-${{ runner.os }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/smoke-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

  candidate-check:
    name: agent-runtime-candidate-check
    if: always() && needs.metadata.result != 'skipped'
    needs: [metadata, static-checks, macos-package, windows-install, authenticated-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable check
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*) echo "Candidate check failed: $RESULTS" >&2; exit 1 ;;
          esac
