name: agent-runtime-candidate-check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: agent-runtime-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'agent-runtime-candidate')
    runs-on: ubuntu-24.04
    outputs:
      agent: ${{ steps.meta.outputs.agent }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve immutable candidate metadata
        id: meta
        shell: bash
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          case ",$LABELS," in
            *,agent-runtime-codex,*) AGENT=codex ;;
            *,agent-runtime-claude,*) AGENT=claude ;;
            *,agent-runtime-opencode,*) AGENT=opencode ;;
            *) echo "Missing Agent label" >&2; exit 1 ;;
          esac
          VERSION=${BRANCH#chore/upgrade-$AGENT-}
          if [[ "$VERSION" == "$BRANCH" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid candidate branch: $BRANCH" >&2
            exit 1
          fi
          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  static-checks:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Deterministic gates
        id: deterministic
        continue-on-error: true
        env:
          AGENT: ${{ needs.metadata.outputs.agent }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/agent-runtime-upgrade.mjs check
          node scripts/check-agent-runtime-diff.mjs --agent "$AGENT" --base "$BASE_SHA" --head "$HEAD_SHA"
          node --test scripts/agent-runtime-upgrade.test.mjs scripts/check-agent-runtime-diff.test.mjs scripts/publish-agentroam-release.test.mjs
          bunx vitest run scripts/agent-runtime-live-smoke.test.ts
          bunx tsc -p scripts/tsconfig.agent-runtime.json
      - name: Focused runtime contracts
        id: focused
        continue-on-error: true
        shell: bash
        env:
          AGENT: ${{ needs.metadata.outputs.agent }}
        run: |
          case "$AGENT" in
            codex) bunx vitest run packages/cli/src/codex-runtime-manager.test.ts packages/desktop/main/agent-runtime/codex-runtime-adapter.test.ts ;;
            claude) bunx vitest run packages/desktop/main/agent-runtime/claude-runtime-adapter.test.ts ;;
            opencode) bunx vitest run packages/cli/src/opencode-runtime-manager.test.ts packages/desktop/main/agent-runtime/opencode-runtime-adapter.test.ts packages/desktop/main/agent-runtime/opencode-server-client.test.ts ;;
          esac
      - name: Type checks and production builds
        id: build
        continue-on-error: true
        run: |
          bunx tsc --noEmit -p packages/desktop/tsconfig.json
          bunx tsc --noEmit -p packages/server/tsconfig.json
          bunx tsc --noEmit -p packages/cli/tsconfig.json
          bun run --cwd packages/webapp build
          NEXT_STANDALONE=1 bun run --cwd packages/server build
      - name: Write normalized validation summary
        if: always()
        env:
          DETERMINISTIC: ${{ steps.deterministic.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const checks = {
            deterministic: process.env.DETERMINISTIC,
            focused: process.env.FOCUSED,
            build: process.env.BUILD,
          };
          const success = Object.values(checks).every((value) => value === "success");
          writeFileSync(process.env.RUNNER_TEMP + "/candidate-failure.json", JSON.stringify({
            schemaVersion: 1,
            success,
            category: success ? null : "compatibility",
            checks,
          }, null, 2) + "\n");
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-failure-summary-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/candidate-failure.json
          if-no-files-found: error
          retention-days: 7
      - name: Fail unsuccessful validation
        if: steps.deterministic.outcome != 'success' || steps.focused.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1

  macos-package:
    needs: [metadata, static-checks]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
      - run: bun install --frozen-lockfile
      - run: npm run pack:cli:all
      - run: node scripts/publish-agentroam-release.mjs preflight
      - run: node scripts/verify-cli-install.mjs --artifacts dist/cli-release --bootstrap-script
      - uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-candidate-${{ github.event.pull_request.head.sha }}
          path: dist/cli-release/
          if-no-files-found: error
          retention-days: 7

  windows-install:
    needs: [metadata, macos-package]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: agent-runtime-candidate-${{ github.event.pull_request.head.sha }}
          path: dist/cli-release
      - run: node scripts/publish-agentroam-release.mjs preflight
      - run: node scripts/verify-cli-install.mjs --artifacts dist/cli-release --bootstrap-script

  codex-smoke:
    if: needs.metadata.outputs.agent == 'codex'
    needs: [metadata, static-checks]
    runs-on: ubuntu-24.04
    environment: agent-runtime-smoke-codex
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/codex" --ignore-scripts --no-audit --no-fund "@openai/codex@${{ needs.metadata.outputs.version }}"
      - name: Authenticated Codex smoke
        env:
          OPENAI_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          bun scripts/agent-runtime-live-smoke.ts --agent codex --workspace "$RUNNER_TEMP/workspace" --runtime-home "$RUNNER_TEMP/runtime-home" --expected-version "${{ needs.metadata.outputs.version }}" --executable "$RUNNER_TEMP/codex/node_modules/.bin/codex" > "$RUNNER_TEMP/codex-smoke.json" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-smoke-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/codex-smoke.json
          if-no-files-found: error
          retention-days: 7

  claude-smoke:
    if: needs.metadata.outputs.agent == 'claude'
    needs: [metadata, static-checks]
    runs-on: ubuntu-24.04
    environment: agent-runtime-smoke-claude
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Expose bundled Claude executable
        shell: bash
        run: |
          CLAUDE_BIN=$(find node_modules/.bun -path "*claude-agent-sdk-linux-x64@${{ needs.metadata.outputs.version }}*/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude" -type f -print -quit)
          test -n "$CLAUDE_BIN"
          chmod +x "$CLAUDE_BIN"
          echo "$(dirname "$CLAUDE_BIN")" >> "$GITHUB_PATH"
      - name: Authenticated Claude smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY"
          bun scripts/agent-runtime-live-smoke.ts --agent claude --workspace "$RUNNER_TEMP/workspace" --runtime-home "$RUNNER_TEMP/runtime-home" > "$RUNNER_TEMP/claude-smoke.json" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-smoke-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/claude-smoke.json
          if-no-files-found: error
          retention-days: 7

  opencode-smoke:
    if: needs.metadata.outputs.agent == 'opencode'
    needs: [metadata, static-checks]
    runs-on: ubuntu-24.04
    environment: agent-runtime-smoke-opencode
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/opencode" --ignore-scripts --no-audit --no-fund "opencode-ai@${{ needs.metadata.outputs.version }}"
      - name: Authenticated OpenCode smoke
        env:
          OPENCODE_API_KEY: ${{ secrets.PROVIDER_API_KEY }}
          AGENTROAM_OPENCODE_CONFIG_JSON: ${{ secrets.OPENCODE_CONFIG_JSON }}
        run: |
          test -n "$OPENCODE_API_KEY"
          test -n "$AGENTROAM_OPENCODE_CONFIG_JSON"
          bun scripts/agent-runtime-live-smoke.ts --agent opencode --workspace "$RUNNER_TEMP/workspace" --runtime-home "$RUNNER_TEMP/runtime-home" --expected-version "${{ needs.metadata.outputs.version }}" --executable "$RUNNER_TEMP/opencode/node_modules/.bin/opencode" > "$RUNNER_TEMP/opencode-smoke.json" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-smoke-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/opencode-smoke.json
          if-no-files-found: error
          retention-days: 7

  candidate-check:
    name: agent-runtime-candidate-check
    if: always() && needs.metadata.result != 'skipped'
    needs: [metadata, static-checks, macos-package, windows-install, codex-smoke, claude-smoke, opencode-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable check
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*) echo "Candidate check failed: $RESULTS" >&2; exit 1 ;;
          esac
