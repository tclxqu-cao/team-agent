name: cli-registry-install-verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      NPM_CONFIG_LOGLEVEL: info
      NPM_CONFIG_FETCH_TIMEOUT: "60000"
      NPM_CONFIG_FETCH_RETRIES: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - name: Download exact published packages from the official registry
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { copyFile, mkdir, readFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { resolve } from 'node:path';
          const launcher = JSON.parse(await readFile('packages/cli/package.json', 'utf8'));
          const destination = resolve('dist/cli-release');
          await mkdir(destination, { recursive: true });
          for (const name of ['install-agentroam.sh', 'install-agentroam.ps1']) {
            await copyFile(resolve('packages/cli/install', name), resolve(destination, name));
          }
          const specs = [
            `${launcher.name}@${launcher.version}`,
            ...Object.entries(launcher.optionalDependencies).map(([name, version]) => `${name}@${version}`),
          ];
          const npmCli = resolve(process.execPath, '..', process.platform === 'win32'
            ? 'node_modules/npm/bin/npm-cli.js' : '../lib/node_modules/npm/bin/npm-cli.js');
          execFileSync(process.execPath, [npmCli, 'pack', ...specs, '--registry=https://registry.npmjs.org',
            '--ignore-scripts', '--loglevel=error', '--pack-destination', destination], { stdio: 'inherit' });
          NODE
      - name: Verify downloaded packages against the release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { version } = JSON.parse(readFileSync('packages/cli/package.json', 'utf8'));
          execFileSync('gh', ['release', 'download', `v${version}`, '--repo', process.env.GITHUB_REPOSITORY,
            '--pattern', 'release-manifest.json', '--pattern', 'SHA256SUMS', '--dir', 'dist/cli-release'], { stdio: 'inherit' });
          NODE
          node scripts/publish-agentroam-release.mjs preflight --manifest dist/cli-release/release-manifest.json
      - name: Verify all registry tarballs and preview tags
        if: runner.os == 'macOS'
        run: node scripts/publish-agentroam-release.mjs verify-preview --manifest dist/cli-release/release-manifest.json
      - name: Verify native components, pairing and private Node installation
        run: node scripts/verify-cli-install.mjs --artifacts dist/cli-release --bootstrap-script
