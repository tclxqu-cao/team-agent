name: desktop-release-verify

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Desktop draft release tag
        required: true
      sha256:
        description: Expected Windows installer SHA256
        required: true

permissions:
  contents: write # Draft release downloads require push access.

jobs:
  windows-install:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'AgentRoam-Setup-*-x64.exe' --dir "$env:RUNNER_TEMP/installer"
          if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          $files = @(Get-ChildItem "$env:RUNNER_TEMP/installer/*.exe")
          if ($files.Count -ne 1) { throw 'Expected exactly one installer' }
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:EXPECTED_SHA256) { throw 'Installer checksum mismatch' }
          $process = Start-Process $files[0].FullName -ArgumentList @('/S', "/D=$env:RUNNER_TEMP\AgentRoam") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (!(Test-Path "$env:RUNNER_TEMP/AgentRoam/AgentRoam.exe")) { throw 'Application missing after installation' }
      - name: Prepare runtime using the installed Electron executable
        shell: pwsh
        run: |
          # This is a disposable runner account. Scheduled tasks inherit its real
          # Windows profile, so do not redirect USERPROFILE only in this shell.
          if (Test-Path "$env:USERPROFILE/.agentroam") { throw 'Expected a fresh AgentRoam user profile' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $bootstrap = Start-Process "$env:RUNNER_TEMP/AgentRoam/AgentRoam.exe" -ArgumentList "`"$env:RUNNER_TEMP/AgentRoam/resources/bootstrap/runtime-bootstrap.mjs`"" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/bootstrap.stdout.log" -RedirectStandardError "$env:RUNNER_TEMP/bootstrap.stderr.log"
          $deadline = [DateTime]::UtcNow.AddMinutes(24)
          $lineCount = 0
          do {
            $exited = $bootstrap.WaitForExit(10000)
            $lines = @(Get-Content "$env:RUNNER_TEMP/bootstrap.stdout.log")
            $lines | Select-Object -Skip $lineCount | Write-Output
            $lineCount = $lines.Count
            if ([DateTime]::UtcNow -gt $deadline) {
              Stop-Process -Id $bootstrap.Id -Force
              throw 'First-launch bootstrap exceeded 24 minutes'
            }
          } while (!$exited)
          Get-Content "$env:RUNNER_TEMP/bootstrap.stderr.log"
          if ($bootstrap.ExitCode -ne 0) { throw "Installed first-launch bootstrap failed: $($bootstrap.ExitCode)" }
      - name: Verify native PTY, SQLite, Codex and shell startup
        shell: pwsh
        run: |
          $testProfile = $env:USERPROFILE
          $env:ELECTRON_RUN_AS_NODE = $null
          $node = "$testProfile/.agentroam/node-runtime/node-v22.22.0-win-x64/node.exe"
          if (!(Test-Path $node)) {
            $nodes = @(Get-ChildItem "$testProfile/.agentroam" -Filter node.exe -Recurse)
            if ($nodes.Count -ne 1) { throw 'Managed Node missing or ambiguous' }
            $node = $nodes[0].FullName
          }
          $env:AGENTROAM_MANAGED_NODE = $node
          $env:AGENTROAM_DATA_DIR = "$testProfile/.agentroam"
          $env:AGENTROAM_INSTALL_REMOTE_DESKTOP = 'skip'
          $cli = @(Get-ChildItem "$testProfile/.agentroam/desktop-cli" -Filter agentroam.mjs -Recurse | Where-Object { $_.FullName -match 'node_modules[\\/]agentroam[\\/]bin' })
          if ($cli.Count -ne 1) { throw 'Bundled CLI missing or ambiguous' }
          & $node $cli[0].FullName doctor --data-dir "$testProfile/.agentroam"
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI doctor failed' }
          $runtime = @(Get-ChildItem "$testProfile/.agentroam/desktop-cli" -Filter manifest.json -Recurse | Where-Object { $_.FullName -match 'agentroam-runtime-win32-x64[\\/]manifest.json$' })
          if ($runtime.Count -ne 1) { throw 'Windows runtime manifest missing' }
          $manifest = Get-Content $runtime[0].FullName | ConvertFrom-Json
          if ($manifest.capabilities.nativeConsole -ne 1) { throw 'Native console support missing' }
          $runtimeRoot = Join-Path $runtime[0].DirectoryName 'runtime'
          & "$runtimeRoot/native/agentroam-remote-desktop.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Windows remote desktop encoder self-test failed' }
          & "$runtimeRoot/native/agentroam-remote-unlock.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Windows unlock helper self-test failed' }
          Push-Location $runtimeRoot
          try {
            & $node --input-type=module -e 'import Database from "better-sqlite3"; import pty from "node-pty"; const db = new Database(":memory:"); if (db.prepare("select 42 as result").get().result !== 42) throw new Error("SQLite failed"); db.close(); const shell=pty.spawn("cmd.exe",["/d","/c","echo AGENTROAM_WINDOWS_PTY_OK"],{cols:80,rows:24,env:process.env}); let output=""; const timer=setTimeout(()=>{shell.kill();process.exit(1)},15000); shell.onData(data=>output+=data); shell.onExit(({exitCode})=>{clearTimeout(timer); if(exitCode || !output.includes("AGENTROAM_WINDOWS_PTY_OK")) process.exitCode=1; else console.log("Windows SQLite and real PTY passed")});'
            if ($LASTEXITCODE -ne 0) { throw 'Native runtime smoke failed' }
          } finally { Pop-Location }
      - name: Launch installed desktop shell
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = $null
          $env:AGENTROAM_DESKTOP_USER_DATA = "$env:RUNNER_TEMP/desktop-shell"
          $application = Start-Process "$env:RUNNER_TEMP/AgentRoam/AgentRoam.exe" -ArgumentList '--no-sandbox' -PassThru
          try {
            Start-Sleep -Seconds 15
            $application.Refresh()
            if ($application.HasExited) { throw "Desktop exited at startup: $($application.ExitCode)" }
            $logs = @(Get-ChildItem "$env:RUNNER_TEMP/desktop-shell/logs" -Filter '*.log' -ErrorAction Stop)
            if (!$logs.Count) { throw 'Desktop startup log missing' }
            $text = ($logs | Get-Content) -join "`n"
            if ($text -notmatch 'desktop main booting') { throw 'Desktop main did not initialize' }
            if ($text -match 'uncaughtException|ERR_MODULE_NOT_FOUND|ERR_DLOPEN_FAILED|Cannot find module') { throw 'Desktop startup dependency failure' }
            Write-Output 'Installed Windows desktop process remained running for 15 seconds'
          } finally {
            if (!$application.HasExited) { Stop-Process -Id $application.Id -Force }
          }
